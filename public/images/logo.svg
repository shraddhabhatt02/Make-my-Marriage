<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e1a4"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7114"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="#6b1d2f" stroke="url(#gold)" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="51" fill="none" stroke="url(#gold)" stroke-width="0.8" stroke-dasharray="2,2"/>
  
